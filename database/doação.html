<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer uma contribuição</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
    <div class="topo-conteudo">
      <a class="boton" href="#" id="btn-voltar">← Voltar </a>
      <p>|</p>
      <h1 class="let">Fazer uma contribuição</h1>
    </div>
    <hr>
  </header>
  <br>
  <main>

    <!-- VALOR -->
    <section class="saldo">
      <nav class="text">
        <p class="tsp"><small>VALOR DA CONTRIBUIÇÃO</small></p>
        <br>
        <div class="valores">
          <input type="radio" name="valor" id="v10"><label for="v10">R$10</label>
          <input type="radio" name="valor" id="v25"><label for="v25">R$25</label>
          <input type="radio" name="valor" id="v50" checked><label for="v50">R$50</label>
          <input type="radio" name="valor" id="v100"><label for="v100">R$100</label>
          <input type="radio" name="valor" id="v250"><label for="v250">R$250</label>
        </div>
        <br>
        <input type="number" class="campo1" placeholder="R$ Outro valor" min="5" step="0.01">
      </nav>
    </section>
    <br>
    <nav class="cardi">
    <h2 class="titulo-missoes"> Método de pagamento</h2>
    <br>
    <div class="card-abas">
    <!-- PIX -->
    <details class="card" name="metodo" open>
      <summary class="let1">Pix</summary>
      <div class="missao-rodape">
        <p class="text1">Escaneie o QR Code ou copie o código abaixo (Pix copia e cola).</p>
        <img src="qrcode.png" alt="QR Code Pix" width="160">
        <input type="text" class="campo" readonly
          value="00020126580014BR.GOV.BCB.PIX0136a2f9c3b4-1e2d-4567-89ab-cdef0123">
        <button class="btn-coletar" type="button">Já realizei o pagamento</button>
      </div>
    </details>

    <!-- CARTÃO -->
    <details class="card" name="metodo">
      <summary class="let1">Cartão</summary>
      <form class="missao-rodape">
        <label class="text1">Nome completo
          <input type="text" class="campo" placeholder="Como está no cartão" required>
        </label>
        <label class="text1">Número do cartão
          <input type="text" class="campo" placeholder="0000 0000 0000 0000"
            inputmode="numeric" pattern="[0-9 ]{13,19}" maxlength="19" required>
        </label>
        <label class="text1">Validade
          <input type="text" class="text1" placeholder="MM/AA"
            pattern="(0[1-9]|1[0-2])/[0-9]{2}" maxlength="5" required>
        </label>
        <label class="text1">CVV
          <input type="text" class="campo" placeholder="123"
            inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4" required>
        </label>
        <button class="btn-coletar" type="submit">Contribuir</button>
      </form>
    </details>

    <!-- BOLETO -->
    <details class="card" name="metodo">
      <summary class="let1">Boleto</summary>
      <form class="missao-rodape">
        <label class="text1">Nome completo
          <input type="text" class="campo" placeholder="Seu nome completo" required>
        </label>
        <label class="text1">CPF
          <input type="text" class="campo" placeholder="000.000.000-00"
            pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}" maxlength="14" required>
        </label>
        <label class="text1">E-mail
          <input type="email" class="campo" placeholder="voce@email.com" required>
        </label>
        <p class="text1">O boleto vence em 3 dias úteis e é enviado para o seu e-mail.</p>
        <button class="btn-coletar" type="submit">Gerar boleto</button>
      </form>
    </details>
    </div>
    </nav>

  </main>

</body>
</html>
