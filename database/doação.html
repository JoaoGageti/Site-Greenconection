<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fazer uma contribuição</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f6f8f7;
      color: #18231e;
      font-family: Arial, sans-serif;
    }

    /* Topo */
    .topo {
      display: flex;
      align-items: center;
      gap: 16px;
      max-width: 650px;
      margin: 0 auto;
      padding: 18px 16px;
      border-bottom: 1px solid #dde6e1;
    }
    .voltar { color: #2c6a50; text-decoration: none; font-weight: bold; }
    .divisor { width: 1px; height: 20px; background: #dde6e1; }
    .topo h1 { font-family: Georgia, serif; font-size: 18px; margin: 0; }

    /* Cartões */
    .conteudo { max-width: 650px; margin: 0 auto; padding: 24px 16px; }
    .card {
      background: #fff;
      border: 1px solid #dde6e1;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
    }
    .titulo {
      margin: 0 0 18px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5d7468;
    }

    /* Esconde as bolinhas dos botões de rádio */
    input[type="radio"] { display: none; }

    /* Botões de valor */
    .valores { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .valores label {
      padding: 10px 18px;
      border: 1px solid #dde6e1;
      border-radius: 12px;
      background: #f6f8f7;
      font-weight: bold;
      cursor: pointer;
    }
    .valores label:hover { border-color: #2c6a50; }
    .valores input:checked + label {
      background: #2c6a50;
      border-color: #2c6a50;
      color: #fff;
    }

    /* Campos de texto */
    .campo {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #dde6e1;
      border-radius: 12px;
      background: #eaf3ee;
      font-size: 15px;
      margin-top: 6px;
    }
    .campo:focus { outline: none; border-color: #2c6a50; }

    /* Botões de método de pagamento */
    .metodos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .metodos label {
      padding: 18px 8px;
      text-align: center;
      border: 1px solid #dde6e1;
      border-radius: 12px;
      background: #f6f8f7;
      font-weight: bold;
      cursor: pointer;
    }
    .metodos label:hover { border-color: #2c6a50; }
    #pix:checked ~ .metodos label[for="pix"],
    #cartao:checked ~ .metodos label[for="cartao"],
    #boleto:checked ~ .metodos label[for="boleto"] {
      background: #2c6a50;
      border-color: #2c6a50;
      color: #fff;
    }

    /* Mostra só o painel do método escolhido */
    .painel { display: none; margin-top: 24px; }
    #pix:checked ~ .painel-pix,
    #cartao:checked ~ .painel-cartao,
    #boleto:checked ~ .painel-boleto { display: block; }

    /* Pix */
    .qrcode {
      width: 190px;
      height: 190px;
      margin: 0 auto 14px;
      padding: 12px;
      border: 1px solid #dde6e1;
      border-radius: 14px;
      background: #f3f3f3;
    }
    .qrcode img { width: 100%; height: 100%; }
    .centro { text-align: center; margin: 4px 0; }
    .sub { color: #5d7468; font-size: 14px; }
    .codigo { font-family: monospace; font-size: 12px; color: #5d7468; margin-top: 16px; }

    /* Formulários */
    .rotulo { display: block; margin-bottom: 14px; font-size: 14px; color: #5d7468; }
    .linha { display: flex; gap: 14px; }
    .linha .rotulo { flex: 1; }

    /* Botão principal */
    .botao {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2c6a50;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .botao:hover { background: #245a43; }

    /* Celular */
    @media (max-width: 500px) {
      .metodos label { padding: 14px 4px; font-size: 14px; }
      .linha { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

  <header class="topo">
    <a href="#" class="voltar">← Voltar</a>
    <span class="divisor"></span>
    <h1>Fazer uma contribuição</h1>
  </header>

  <main class="conteudo">

    <!-- VALOR -->
    <section class="card">
      <p class="titulo">Valor da contribuição</p>

      <div class="valores">
        <input type="radio" name="valor" id="v10"><label for="v10">R$ 10</label>
        <input type="radio" name="valor" id="v25"><label for="v25">R$ 25</label>
        <input type="radio" name="valor" id="v50" checked><label for="v50">R$ 50</label>
        <input type="radio" name="valor" id="v100"><label for="v100">R$ 100</label>
        <input type="radio" name="valor" id="v250"><label for="v250">R$ 250</label>
      </div>

      <input type="number" class="campo" placeholder="R$ Outro valor" min="5" step="0.01">
    </section>

    <!-- PAGAMENTO -->
    <section class="card">
      <p class="titulo">Método de pagamento</p>

      <input type="radio" name="metodo" id="pix" checked>
      <input type="radio" name="metodo" id="cartao">
      <input type="radio" name="metodo" id="boleto">

      <div class="metodos">
        <label for="pix">Pix</label>
        <label for="cartao">Cartão</label>
        <label for="boleto">Boleto</label>
      </div>

      <!-- PIX -->
      <div class="painel painel-pix">
        <div class="qrcode">
          <img src="qrcode.png" alt="">
        </div>
        <p class="centro"><strong>Escaneie o QR Code</strong></p>
        <p class="centro sub">Ou copie o código abaixo para pagar via Pix copia e cola</p>
        <input type="text" class="campo codigo" readonly
          value="00020126580014BR.GOV.BCB.PIX0136a2f9c3b4-1e2d-4567-89ab-cdef0123">
        <button class="botao">Já realizei o pagamento</button>
      </div>

      <!-- CARTÃO -->
      <form class="painel painel-cartao">
        <label class="rotulo">Nome completo
          <input type="text" class="campo" placeholder="Como está no cartão" required>
        </label>
        <label class="rotulo">Número do cartão
          <input type="text" class="campo" placeholder="0000 0000 0000 0000"
            inputmode="numeric" pattern="[0-9 ]{13,19}" maxlength="19" required>
        </label>
        <div class="linha">
          <label class="rotulo">Validade
            <input type="text" class="campo" placeholder="MM/AA"
              pattern="(0[1-9]|1[0-2])/[0-9]{2}" maxlength="5" required>
          </label>
          <label class="rotulo">CVV
            <input type="text" class="campo" placeholder="123"
              inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4" required>
          </label>
        </div>
        <button type="submit" class="botao">Contribuir</button>
      </form>

      <!-- BOLETO -->
      <form class="painel painel-boleto">
        <label class="rotulo">Nome completo
          <input type="text" class="campo" placeholder="Seu nome completo" required>
        </label>
        <label class="rotulo">CPF
          <input type="text" class="campo" placeholder="000.000.000-00"
            pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}" maxlength="14" required>
        </label>
        <label class="rotulo">E-mail
          <input type="email" class="campo" placeholder="voce@email.com" required>
        </label>
        <p class="sub">O boleto vence em 3 dias úteis e é enviado para o seu e-mail.</p>
        <button type="submit" class="botao">Gerar boleto</button>
      </form>
    </section>

  </main>

</body>
</html>
