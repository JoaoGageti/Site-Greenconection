<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonificação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

    <main class="container">
        
            <nav class="topo">
            <a class='boton' href="green.html" id="btn-voltar">← Voltar </a>
            <p>|</p>
            <h1 class="Login"> Criar conta </h1>
        </nav>
            <hr>
            <br>
            <section class="card">
            <form id="formulario" action="#" method="post" novalidate>

                
                    <nav class="cardv1">

                   <input class="texto_do_card"
                        type="text"
                        name="name"
                        placeholder="👤 Nome completo"
                        id="nome"
                        required>
                        <br>
                        </nav>
                        <br>
                        <nav class="cardv2">

                   <input class="texto_do_card"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="📧 E-mail"
                        autocomplete="email"
                        aria-describedby="emailcheck"
                        required
                    >
                    <p id="emailcheck" role="alert" aria-live="polite"></p>
                    </nav>
                    <br>

                   
                    <nav class="cardv3">
                    <input class="texto_do_card"
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="current-password"
                        aria-describedby="senhacheck"
                        placeholder="🔒 Senha (mín. 6 caracteres)"
                        required
                    >
                    <p id="senhacheck" role="alert" aria-live="polite"></p>
                    </nav>
                    <br>

                    <div class="acoes">

                        <button class="texti" id="loginbt" type="submit">
                            Criar conta
                        </button>

                    </div>

                

            </form>

        </section>

    </main>
    </body>
